services:
  db:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: wordpress
      MYSQL_USER: wordpress
      MYSQL_PASSWORD: wordpress
      MYSQL_ROOT_PASSWORD: rootpassword
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10

  wordpress:
    image: wordpress:6.8-php8.2-apache
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
      WORDPRESS_DB_NAME: wordpress
      # Next.js on the host (Docker Desktop). Match REVALIDATION_SECRET in .env.local
      ARIA_REVALIDATE_URL: http://host.docker.internal:3000/api/revalidate
      ARIA_REVALIDATE_SECRET: ${REVALIDATION_SECRET:-local-dev-revalidate-secret}
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_HOME', 'http://localhost:8080');
        define('WP_SITEURL', 'http://localhost:8080');
        define('ARIA_REVALIDATE_URL', getenv('ARIA_REVALIDATE_URL') ?: '');
        define('ARIA_REVALIDATE_SECRET', getenv('ARIA_REVALIDATE_SECRET') ?: '');
    volumes:
      - wp_data:/var/www/html
      - ./wordpress/mu-plugins:/var/www/html/wp-content/mu-plugins
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
  wp_data:
